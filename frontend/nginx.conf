server {
  listen 80;
  server_name _;

  # Allow image uploads (default is 1m which is too small for photos).
  client_max_body_size 20m;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri /index.html;
  }

  # Proxy API calls to backend container (same-origin for browser).
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
    # Preserve the original host (including port) to keep backend redirects same-origin.
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
